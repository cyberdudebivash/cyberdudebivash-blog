name: "🛰 SENTINEL APEX — Intelligence Hub Generator"

on:
  push:
    branches: [main]
    paths:
      - 'api/intel/products/**'
      - 'api/intel/cve/**'
      - 'api/_lib/intelligence-hub.js'
      - 'generate-intelligence-hub.js'
      - 'tests-js/**'
      - '.github/workflows/intelligence-hub.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-content-writers
  cancel-in-progress: false

jobs:
  generate-intelligence-hub:
    name: "Generate & Validate Intelligence Hub"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: "🔬 Syntax-check the generator and library"
        run: |
          node -c generate-intelligence-hub.js
          node -c api/_lib/intelligence-hub.js

      - name: "🧪 Run intelligence hub unit tests"
        run: node --test tests-js/intelligence-hub.test.js

      - name: "🛰 Generate intelligence hub pages"
        run: |
          echo "🛰 Generating intelligence hub — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          node generate-intelligence-hub.js
          echo "✅ generate-intelligence-hub.js completed"

      - name: "✅ Validate output"
        run: |
          for f in vendor/index.html timeline/index.html collections/index.html detections/live-feed.html threat/index.html api/intel/vendors.json api/intel/timeline.json api/intel/collections.json api/intel/detections-library.json; do
            if [ ! -f "$f" ]; then
              echo "::error title=Intelligence Hub Generation Failed::Missing expected output $f"
              exit 1
            fi
          done
          if [ -f "sitemap.xml" ] && command -v xmllint >/dev/null 2>&1; then
            xmllint --noout sitemap.xml || { echo "::error title=Sitemap Invalid::sitemap.xml is not well-formed XML"; exit 1; }
          fi
          echo "✅ Intelligence hub output present and valid"

      - name: "🔍 Check for changes"
        id: check_changes
        run: |
          if [ -z "$(git status --porcelain vendor/ timeline/ collections/ detections/live-feed.html threat/index.html api/intel/vendors.json api/intel/vendor/ api/intel/timeline.json api/intel/collections.json api/intel/detections-library.json sitemap.xml 2>/dev/null)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No intelligence hub changes — no commit needed"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Intelligence hub changes detected — will commit"
          fi

      - name: "📦 Commit and publish hub — bounded fast-forward regeneration"
        if: steps.check_changes.outputs.changed == 'true'
        timeout-minutes: 5
        run: bash scripts/publish-intelligence-hub.sh

      - name: "📋 Run summary"
        if: always()
        run: |
          echo "════════════════════════════════════"
          echo "🛰 SENTINEL APEX Intelligence Hub Generator Done"
          echo "Timestamp : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Trigger   : ${{ github.event_name }}"
          echo "Vendors   : $(ls vendor/*.html 2>/dev/null | wc -l)"
          echo "Collections: $(ls collections/*.html 2>/dev/null | wc -l)"
          echo "════════════════════════════════════"
