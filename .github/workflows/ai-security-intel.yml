name: "🧠 SENTINEL APEX — AI Security Intelligence Pipeline"

# Dedicated AI Security Intelligence lane, run ALONGSIDE (never merged with) the
# general intel pipeline (sentinel-apex.yml). See Sentinel-APEX/pipeline/AI-SECURITY-PIPELINE.md.
#
# Existing cadence retained: even UTC hours at minute 7.
# Hosting retirement does not increase ingestion or publication workload.
#
# Offset from :00 (rather than exactly on the hour) so this schedule doesn't
# stack with the other 8 cron schedules in this repo on the same wall-clock
# minute — GitHub Actions documents that scheduled triggers can be delayed or
# dropped under load, especially at the top of the hour. Every scheduled
# workflow in this repo now uses a distinct minute offset (see sentinel-apex.yml
# for the incident this fixes).

on:
  schedule:
    - cron: "7 */2 * * *"   # even UTC hours, :07
  workflow_dispatch:
    inputs:
      run_analyst:
        description: "Run the optional LLM analyst stage (requires ANTHROPIC_API_KEY secret)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: main-content-writers
  cancel-in-progress: false

jobs:
  ai-security-intel:
    name: "Collect → Classify → Map (ATLAS/OWASP) → Gate → Publish"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: "Pre-flight: verify engine"
        run: |
          echo "🧠 SENTINEL APEX — AI Security Intelligence — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # Scheduled production publishing and secret-bearing analyst runs
          # must never execute on an unreviewed workflow_dispatch feature ref.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error title=AI publisher branch blocked::Only the main ref may run customer-visible AI security publication"
            exit 2
          fi
          test -f ai-security-intel-engine.js || (echo "❌ FATAL: ai-security-intel-engine.js missing" && exit 1)
          if ! node --check ai-security-intel-engine.js 2>&1; then
            echo "::error title=Engine Syntax Error::ai-security-intel-engine.js failed node --check."
            exit 1
          fi
          echo "✅ Engine syntax OK — $(wc -l < ai-security-intel-engine.js) lines"

      - name: "Run AI Security Intelligence pipeline"
        timeout-minutes: 6
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AISEC_ANALYST: ${{ github.event.inputs.run_analyst == 'true' && '1' || '' }}
        run: |
          echo "🚀 Starting pipeline at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # Actions executes Bash with -e; capture timeouts in a conditional
          # or cleanup and truthful result accounting are bypassed entirely.
          if timeout 340 node ai-security-intel-engine.js; then
            EXIT=0
          else
            EXIT=$?
          fi
          rm -f ai-security-intel.lock 2>/dev/null || true
          if [ "$EXIT" -eq 0 ]; then
            echo "✅ Pipeline completed (exit 0)"
          elif [ "$EXIT" -eq 124 ] || [ "$EXIT" -eq 143 ]; then
            # An interrupted publication is not evidence of an atomic,
            # reconciled customer feed. Do not commit partial output.
            echo "::error title=AI Security Publisher Timed Out::Incomplete source output withheld; operator reconciliation required"
            exit "$EXIT"
          else
            echo "::error title=AI Security Pipeline Runtime Error::exit ${EXIT}"
            exit "$EXIT"
          fi

      - name: "Detect changes"
        id: changes
        run: |
          git config user.name  "SENTINEL-APEX[bot]"
          git config user.email "sentinel-apex@cyberdudebivash.com"
          rm -f ai-security-intel.lock
          CHANGED=$(git status --short | grep -v "ai-security-intel.lock" | wc -l | tr -d ' ')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "ℹ️ ${CHANGED} file(s) changed"

      - name: "Commit & push"
        if: steps.changes.outputs.changed != '0'
        run: |
          # Only these four reviewed AI-security output destinations can be
          # committed. Missing paths or Git errors are NOT "nothing to commit".
          git add -A -- api/intel/ai-security.json ai-security/ ai-security-intel-state.json ai-security-intel-memory.json
          if git diff --cached --quiet --exit-code; then
            echo "::error title=AI publication persistence not verified::Changes detected but no approved output staged"
            exit 2
          else
            DIFF_EXIT=$?
            if [ "$DIFF_EXIT" -ne 1 ]; then
              echo "::error title=AI staged index unavailable::Git staged diff failed"
              exit "$DIFF_EXIT"
            fi
          fi
          STATS=$(node -e "try{const s=require('./ai-security-intel-state.json').lastStats||{};console.log('pub='+(s.published||0)+' p1='+(s.p1||0)+' leads='+(s.leadsHeld||0))}catch(e){console.log('updated')}")
          git commit -m "SENTINEL APEX AI-SEC: ${STATS} [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] [skip ci]"
          pushed=false
          for i in 1 2 3 4; do
            if git push origin HEAD; then echo "✅ pushed"; pushed=true; break; fi
            echo "push failed, retrying in $((2**i))s"; git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || { echo "⚠️ Rebase conflict — aborting cleanly, will retry"; git rebase --abort 2>/dev/null || true; }; sleep $((2**i))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error title=AI Security Intelligence State Persistence Failed::Four Git pushes failed; publisher state not saved to main. Operator reconciliation required."
            exit 1
          fi

