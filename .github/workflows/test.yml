name: Sentinel APEX Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'api/**'
      - 'scripts/check-intel-freshness.js'
      - 'scripts/__tests__/**'
      - 'tests/**/*.js'
      - 'tests/**/*.ts'
      - 'jest.config.js'
      - 'jest.setup.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
      - '.github/workflows/freshness-check.yml'
  # No path filter on PRs: these jobs are the required status checks for
  # main (docs/runbooks/MAIN-BRANCH-PROTECTION.md). A required check that a
  # path filter skips never reports, and the PR can never merge.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Jest Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Check TypeScript compilation
        run: npx tsc --noEmit
      - name: Run Jest with coverage
        run: npm run test:ci
        env:
          NODE_ENV: test
      - name: Archive canonical coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node22
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate tenant-scoped SOC D1 schema (offline SQLite)
        run: python3 -m unittest -v tests.test_soc_tenant_schema
      - name: Validate SOC incident audit, lifecycle and tenant controls (offline SQLite)
        run: python3 -m unittest -v tests.test_soc_incident_invariants
      - name: Validate SOC authoritative identity session schema (offline SQLite)
        run: python3 -m unittest -v tests.test_soc_auth_sessions
      - name: Validate SOC approved-source event receipts and atomic audit (offline SQLite)
        run: python3 -m unittest -v tests.test_soc_event_receipt_integrity
      - name: Validate SOC connector HMAC signing key rotation and revocation (offline SQLite)
        run: python3 -m unittest -v tests.test_soc_connector_key_lifecycle
      - name: Validate SOC analyst detection evidence provenance and incident linkage (offline SQLite)
        run: python3 -m unittest -v tests.test_soc_detection_review_provenance
      - name: Validate SOC source ID persistence and authorized source lookup requirements (offline SQLite)
        run: python3 -m unittest -v tests.test_soc_original_event_identity
      - name: Validate SOC atomic evidence source read quota (offline SQLite)
        run: python3 -m unittest -v tests.test_soc_evidence_read_budget
      - name: P0 SOC — Gated durable outbox native SQLite safety and replay tests
        run: node --test tests-js/soc-notification-outbox-native.test.js
      - name: P0 SOC — Reject ambiguous outbox stage receipts
        run: node --test tests-js/soc-outbox-stage-receipt.test.js
      - name: P0 FinOps — SQL-index and watcher-cost contract against offline native SQLite
        run: node --test tests-js/soc-watchlist-native-sqlite-cost-contract.test.js

      - name: Verify legacy alert fan-out release-cost gates
        run: node --test tests-js/legacy-watchlist-fanout-cost-contract.test.js
      - name: P0 — Race-safe intelligence hub publisher offline integration test
        run: node --test tests-js/intelligence-hub-publish-race.test.js
      - name: P0 — Bounded delivery and backlog truth negative controls
        run: node --test tests-js/watchlist-delivery-cli-truth.test.js
      - name: Verify native D1 rehearsal cannot target remote production
        run: node --test tests-js/soc-native-d1-local-certify.test.js
      - name: P0 — Public SOC feed freshness and source-parity negative controls
        run: node --test tests-js/soc-public-feed-parity.test.js
      - name: P0 — Per-run source yield evidence and false-green source health controls
        run: node --test tests-js/intel-source-yield-truth.test.js
      - name: P0 — Independent health certification never reports stale or zero-yield intel as green
        run: node --test tests-js/pipeline-operational-health-truth.test.js
      - name: P0 — NVD CVE 2.0 request contract and upstream failure negative controls
        run: node --test tests-js/nvd-cve-query-contract.test.js
      - name: P0 — Verify Cloudflare release control is manual-only and drift comparisons fail closed
        run: node --test tests-js/production-drift-safety.test.js
      - name: P0 — Prevent DNS migration during routine Cloudflare content releases
        run: node --test tests-js/cloudflare-routine-release-dns-safety.test.js
      - name: P0 — Zero-overage shared Cloudflare account budget, logging, and release control
        run: node --test tests-js/cloudflare-account-zero-overage-gate.test.js
      - name: Rehearse complete migrations and quota against Wrangler local D1 only
        run: node scripts/soc-native-d1-local-certify.cjs
      - name: Validate production entrypoint syntax
        run: node --check fetch-live-intel.js
      - name: SOC identity and all-pages UX regression contract
        run: node --test tests-js/soc-platform-presentation.test.js
      - name: First scoped SOC assessment truth and customer engagement bounds
        run: node --test tests-js/soc-first-offer.test.js
      - name: SOC readiness delivery evidence and customer acceptance negative controls
        run: node --test tests-js/soc-readiness-delivery-gate.test.js
      - name: P0 managed SOC global GA evidence and operational NO-GO negative controls
        run: node --test tests-js/soc-commercial-ga-gate.test.js
      - name: Seller identity and commercial/legal truth boundary
        run: node --test tests-js/soc-seller-identity.test.js
      - name: Enterprise CTI reader v14 layout and accessibility regressions
        run: node --test tests-js/cti-enterprise-reader-v14.test.js
      - name: Ecosystem promotion truth, placement and accessibility regressions
        run: node --test tests-js/cti-ecosystem-showcase.test.js
      - name: Dependency audit — production critical gate
        run: npm audit --omit=dev --audit-level=critical

  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test, build-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test

  test-governance:
    name: Governance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Run governance tests
        run: npm run test:governance
        env:
          NODE_ENV: test

  test-performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test-governance
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Run performance tests
        run: npm run test:performance
        env:
          NODE_ENV: test

  test-resilience:
    name: Resilience Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-performance
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Run resilience tests
        run: npm run test:resilience
        env:
          NODE_ENV: test

  coverage-check:
    name: Coverage Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, test-resilience]
    steps:
      - name: Download canonical coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: test-results-node22
          path: coverage
      - name: Verify coverage artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/coverage-final.json
          test -s coverage/lcov.info
          echo "Canonical coverage artifact is present and non-empty."
