name: "⚡ SENTINEL APEX — Intel Feed Freshness Monitor"

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

concurrency:
  group: blog-freshness-check
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  freshness-check:
    name: "Verify SENTINEL APEX runtime, intel, and Blogger freshness"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: "Classify runtime and content freshness"
        id: freshness
        shell: bash
        run: |
          echo "⚡ SENTINEL APEX — Freshness Check — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          set +e
          CLASSIFIER_OUTPUT=$(node scripts/check-intel-freshness.js live-intel.json intel-state.json 2>&1)
          CHECK_EXIT=$?
          set -e
          printf '%s\n' "$CLASSIFIER_OUTPUT"
          STATUS=$(printf '%s\n' "$CLASSIFIER_OUTPUT" | sed -n 's/^STATUS=//p' | tail -1)
          echo "classifier_exit=${CHECK_EXIT}" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          case "$CHECK_EXIT" in
            0) echo "recovery_required=false" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "recovery_required=false" >> "$GITHUB_OUTPUT"
              echo "::error title=SENTINEL APEX Monitor Integrity Failure::Freshness classifier reported monitor/feed corruption. Automatic generator recovery is intentionally suppressed."
              exit 1
              ;;
            2)
              echo "recovery_required=true" >> "$GITHUB_OUTPUT"
              echo "::warning title=SENTINEL APEX Runtime Outage::Generator runtime exceeded the critical threshold. Controlled recovery is starting."
              ;;
            *)
              echo "recovery_required=false" >> "$GITHUB_OUTPUT"
              echo "::error title=Freshness Classifier Contract Error::Unexpected classifier exit code ${CHECK_EXIT}."
              exit "$CHECK_EXIT"
              ;;
          esac

      - name: "Dispatch recovery and wait for completion"
        id: recovery
        if: steps.freshness.outputs.recovery_required == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'sentinel-apex.yml';
            const dispatchStartedAt = Date.now();
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            core.warning('Proven runtime outage detected — dispatching SENTINEL APEX recovery and waiting for a verified result.');
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflowId, ref: 'main',
              inputs: { force_reset_state: 'false', debug: 'true' }
            });
            let recoveryRun = null;
            for (let attempt = 1; attempt <= 30; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflowId, event: 'workflow_dispatch', branch: 'main', per_page: 20
              });
              const candidates = data.workflow_runs
                .filter(run => Date.parse(run.created_at) >= dispatchStartedAt - 5000)
                .filter(run => run.actor && run.actor.login === 'github-actions[bot]')
                .sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));
              if (candidates.length > 0) { recoveryRun = candidates[0]; break; }
              console.log(`Waiting for recovery run registration (${attempt}/30)...`);
              await sleep(3000);
            }
            if (!recoveryRun) throw new Error('Recovery dispatch was accepted but no matching SENTINEL APEX workflow run appeared within 90 seconds.');
            core.setOutput('recovery_run_id', String(recoveryRun.id));
            core.setOutput('recovery_run_url', recoveryRun.html_url);
            console.log(`Recovery run discovered: #${recoveryRun.run_number} ${recoveryRun.html_url}`);
            for (let attempt = 1; attempt <= 120; attempt++) {
              const { data: current } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: recoveryRun.id });
              console.log(`Recovery status: ${current.status}${current.conclusion ? ` / ${current.conclusion}` : ''}`);
              if (current.status === 'completed') {
                core.setOutput('recovery_conclusion', current.conclusion || 'unknown');
                if (current.conclusion !== 'success') throw new Error(`SENTINEL APEX recovery run ${current.id} completed with conclusion=${current.conclusion}.`);
                core.notice(`SENTINEL APEX recovery run #${current.run_number} completed successfully.`);
                return;
              }
              await sleep(5000);
            }
            throw new Error(`Timed out waiting for SENTINEL APEX recovery run ${recoveryRun.id} to complete.`);

      - name: "Re-verify production after recovery"
        id: post_recovery
        if: steps.freshness.outputs.recovery_required == 'true'
        shell: bash
        run: |
          echo "🔁 Recovery completed — refreshing origin/main before the final health decision"
          git fetch --depth=1 origin main
          git reset --hard origin/main
          set +e
          POST_OUTPUT=$(node scripts/check-intel-freshness.js live-intel.json intel-state.json 2>&1)
          POST_EXIT=$?
          set -e
          printf '%s\n' "$POST_OUTPUT"
          POST_STATUS=$(printf '%s\n' "$POST_OUTPUT" | sed -n 's/^STATUS=//p' | tail -1)
          echo "classifier_exit=${POST_EXIT}" >> "$GITHUB_OUTPUT"
          echo "status=${POST_STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          if [ "$POST_EXIT" -ne 0 ]; then
            echo "::error title=SENTINEL APEX Recovery Verification Failed::Recovery workflow completed, but production freshness is still unhealthy (status=${POST_STATUS:-UNKNOWN}, exit=${POST_EXIT})."
            exit "$POST_EXIT"
          fi
          echo "::notice title=SENTINEL APEX Self-Healed::The runtime outage was recovered and production freshness re-verified successfully against the latest main branch."

      - name: "Classify customer-facing Blogger publication freshness"
        id: blogger_freshness
        shell: bash
        run: |
          set +e
          BLOGGER_OUTPUT=$(python3 scripts/check_blogger_publication_freshness.py data/published_posts.json --max-age-minutes 240 2>&1)
          BLOGGER_EXIT=$?
          set -e
          printf '%s\n' "$BLOGGER_OUTPUT"
          BLOGGER_STATUS=$(printf '%s\n' "$BLOGGER_OUTPUT" | sed -n 's/^STATUS=//p' | tail -1)
          BLOGGER_RECOVERY=$(printf '%s\n' "$BLOGGER_OUTPUT" | sed -n 's/^RECOVERY_REQUIRED=//p' | tail -1)
          BLOGGER_AGE=$(printf '%s\n' "$BLOGGER_OUTPUT" | sed -n 's/^AGE_MINUTES=//p' | tail -1)
          BLOGGER_LATEST=$(printf '%s\n' "$BLOGGER_OUTPUT" | sed -n 's/^LATEST_PUBLISHED_AT=//p' | tail -1)
          echo "classifier_exit=$BLOGGER_EXIT" >> "$GITHUB_OUTPUT"
          echo "status=${BLOGGER_STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "recovery_required=${BLOGGER_RECOVERY:-false}" >> "$GITHUB_OUTPUT"
          echo "age_minutes=${BLOGGER_AGE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "latest_published_at=${BLOGGER_LATEST:-unavailable}" >> "$GITHUB_OUTPUT"

          case "$BLOGGER_EXIT" in
            0)
              echo "Customer-facing Blogger freshness is healthy."
              ;;
            1)
              echo "::error title=Blogger Freshness Monitor Integrity Failure::Cannot prove customer-facing publication freshness from persisted publication state."
              exit 1
              ;;
            2)
              echo "::warning title=Blogger CTI Publication Stale::No successful customer-facing Blogger publication inside the 240-minute SLO. Controlled Blogger recovery is eligible."
              ;;
            *)
              echo "::error title=Blogger Freshness Contract Error::Unexpected classifier exit code $BLOGGER_EXIT."
              exit "$BLOGGER_EXIT"
              ;;
          esac

      - name: "Dispatch Blogger publication recovery when customer feed is stale"
        id: blogger_recovery
        if: steps.freshness.outputs.recovery_required != 'true' && steps.blogger_freshness.outputs.recovery_required == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'blogger-syndication.yml';
            const cooldownMs = 45 * 60 * 1000;
            const now = Date.now();

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              branch: 'main',
              per_page: 10
            });

            const latest = data.workflow_runs[0] || null;
            if (latest && latest.status !== 'completed') {
              core.notice('Blogger recovery suppressed: run #' + latest.run_number + ' is already ' + latest.status + '.');
              core.setOutput('dispatch_state', 'already-running');
              core.setOutput('recovery_run_url', latest.html_url || '');
              return;
            }

            if (latest && (now - Date.parse(latest.created_at)) < cooldownMs) {
              core.warning('Blogger remains stale, but run #' + latest.run_number + ' started less than 45 minutes ago; suppressing duplicate recovery dispatch.');
              core.setOutput('dispatch_state', 'cooldown');
              core.setOutput('recovery_run_url', latest.html_url || '');
              return;
            }

            const dispatchStartedAt = Date.now();
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: {
                dry_run: 'false',
                max_posts: '2'
              }
            });
            core.setOutput('dispatch_state', 'dispatched');

            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 20; attempt++) {
              const { data: refreshed } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                event: 'workflow_dispatch',
                branch: 'main',
                per_page: 10
              });
              const recoveryRun = refreshed.workflow_runs
                .filter(run => Date.parse(run.created_at) >= dispatchStartedAt - 5000)
                .sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at))[0];
              if (recoveryRun) {
                core.setOutput('recovery_run_id', String(recoveryRun.id));
                core.setOutput('recovery_run_url', recoveryRun.html_url || '');
                core.notice('Customer-facing Blogger recovery dispatched as run #' + recoveryRun.run_number + '.');
                return;
              }
              await sleep(3000);
            }

            throw new Error('Blogger recovery dispatch was accepted but no workflow run appeared within 60 seconds.');

      - name: "Monitor result summary"
        if: always()
        shell: bash
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "⚡ SENTINEL APEX — FRESHNESS MONITOR RESULT"
          echo "══════════════════════════════════════════════════════"
          echo "Initial status       : ${{ steps.freshness.outputs.status || 'UNAVAILABLE' }}"
          echo "Initial classifier   : ${{ steps.freshness.outputs.classifier_exit || 'UNAVAILABLE' }}"
          echo "Recovery required    : ${{ steps.freshness.outputs.recovery_required || 'false' }}"
          echo "Recovery run         : ${{ steps.recovery.outputs.recovery_run_id || 'not-dispatched' }}"
          echo "Recovery conclusion  : ${{ steps.recovery.outputs.recovery_conclusion || 'not-applicable' }}"
          echo "Post-recovery status : ${{ steps.post_recovery.outputs.status || 'not-applicable' }}"
          echo "Blogger freshness     : ${{ steps.blogger_freshness.outputs.status || 'UNAVAILABLE' }}"
          echo "Blogger age (minutes): ${{ steps.blogger_freshness.outputs.age_minutes || 'unavailable' }}"
          echo "Latest Blogger post  : ${{ steps.blogger_freshness.outputs.latest_published_at || 'unavailable' }}"
          echo "Blogger recovery      : ${{ steps.blogger_recovery.outputs.dispatch_state || 'not-required' }}"
          echo "Blogger recovery run  : ${{ steps.blogger_recovery.outputs.recovery_run_url || 'not-dispatched' }}"
          echo "Timestamp             : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "══════════════════════════════════════════════════════"

      - name: "Alert on unresolved monitor failure"
        if: failure()
        shell: bash
        run: |
          if [ "${{ steps.blogger_freshness.outcome }}" = "failure" ]; then
            echo "::error title=SENTINEL APEX Blogger Freshness Alert::Internal generation may be healthy, but customer-facing Blogger publication freshness cannot be proven."
            echo "Latest Blogger publication: ${{ steps.blogger_freshness.outputs.latest_published_at || 'unavailable' }}"
            echo "Blogger publication age: ${{ steps.blogger_freshness.outputs.age_minutes || 'unavailable' }} minutes"
          elif [ "${{ steps.blogger_recovery.outcome }}" = "failure" ]; then
            echo "::error title=SENTINEL APEX Blogger Recovery Alert::Blogger was stale and the controlled self-healing dispatch failed."
            echo "Blogger recovery run: ${{ steps.blogger_recovery.outputs.recovery_run_url || 'unavailable' }}"
          elif [ "${{ steps.freshness.outputs.classifier_exit }}" = "1" ]; then
            echo "::error title=SENTINEL APEX Monitor Alert::Feed/monitor integrity validation failed. Runtime recovery was intentionally not dispatched."
          elif [ "${{ steps.freshness.outputs.recovery_required }}" = "true" ]; then
            echo "::error title=SENTINEL APEX Recovery Alert::A runtime outage was detected and automatic recovery did not restore a verified healthy state."
            echo "Recovery run: ${{ steps.recovery.outputs.recovery_run_url || 'unavailable' }}"
          else
            echo "::error title=SENTINEL APEX Monitor Alert::Freshness monitoring failed unexpectedly."
          fi
          echo "Initial classifier exit: ${{ steps.freshness.outputs.classifier_exit || 'unavailable' }}"
          echo "Post-recovery exit: ${{ steps.post_recovery.outputs.classifier_exit || 'not-applicable' }}"
          echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
