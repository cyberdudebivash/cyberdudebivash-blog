name: "🧭 SENTINEL APEX — Production Drift Reconciler"

on:
  workflow_run:
    workflows:
      - "⚡ SENTINEL APEX v5.0 — High-Frequency Global Intel Pipeline"
      - "🧠 SENTINEL APEX — AI Security Intelligence Pipeline"
      - "🛰 SENTINEL APEX — Auto CVE Page Generator"
      - "🛰 SENTINEL APEX — Auto RSS Generator"
      - "🛰 SENTINEL APEX — Intelligence Hub Generator"
      - "⚡ CYBERDUDEBIVASH® — Blogger Syndication Engine"
    types: [completed]
    branches: [main]
  schedule:
    # Keep existing 30-minute cadence, offset from :00/:30 GitHub load spikes.
    # No additional schedules or Cloudflare usage.
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-drift-reconciler
  cancel-in-progress: true

jobs:
  reconcile:
    name: "Read-only drift assessment — operator-approved releases only"
    # A producer may commit verified source data and then FAIL a post-push
    # source-yield or publication-quality gate. Still perform drift inventory
    # for completed success/failure/cancelled producer runs. Monitoring is
    # read-only and MUST NOT retry a failed publisher or deploy a Worker.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Read source-of-truth release policy"
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: "Compare fully certified deploy with main (no mutation)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-drift-policy.cjs
