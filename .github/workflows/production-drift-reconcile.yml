name: "🧭 SENTINEL APEX — Production Drift Reconciler"

on:
  workflow_run:
    workflows:
      - "⚡ SENTINEL APEX v5.0 — High-Frequency Global Intel Pipeline"
      - "🧠 SENTINEL APEX — AI Security Intelligence Pipeline"
      - "🛰 SENTINEL APEX — Auto CVE Page Generator"
      - "🛰 SENTINEL APEX — Auto RSS Generator"
      - "🛰 SENTINEL APEX — Intelligence Hub Generator"
      - "⚡ CYBERDUDEBIVASH® — Blogger Syndication Engine"
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-drift-reconciler
  cancel-in-progress: true

jobs:
  reconcile:
    name: "Read-only drift assessment — operator-approved releases only"
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Read source-of-truth release policy"
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: "Compare fully certified deploy with main (no mutation)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-drift-policy.cjs
