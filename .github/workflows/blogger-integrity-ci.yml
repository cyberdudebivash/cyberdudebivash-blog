name: "Blogger Evidence Integrity CI"

on:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'malware/**'
      - 'ai-security/**'
      - 'intel/**'
      - 'api.html'
      - 'pricing.html'
      - 'tests/test_commercial_intel_surfaces.py'
      - 'tests/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/blogger-syndication.yml'
      - '.github/workflows/blogger-legacy-quality.yml'
      - '.github/workflows/blogger-integrity-ci.yml'
      - '.github/workflows/workflow-security-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'automation/**'
      - 'tests/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/blogger-syndication.yml'
      - '.github/workflows/blogger-legacy-quality.yml'
      - '.github/workflows/blogger-integrity-ci.yml'
      - '.github/workflows/workflow-security-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Evidence gate, renderer, and pipeline tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Commercial intelligence surface integrity
        run: python3 tests/test_commercial_intel_surfaces.py
      - name: "Checkout"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: "Compile production modules"
        run: python -m compileall -q automation

      - name: "Run complete syndication suite"
        run: python -m pytest tests/ automation/tests/ --tb=short --timeout=30 -q
