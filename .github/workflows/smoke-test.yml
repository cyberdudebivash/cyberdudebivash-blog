name: "🚀 SENTINEL APEX — Production Smoke Test"

on:
  push:
    branches: [main]
    paths-ignore:
      - 'posts/**'
      - 'intel-state.json'
      - 'intel-memory.json'
      - 'live-intel.json'
      - 'rss.xml'
      - 'sitemap.xml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: "Production URL Health Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Public health probe; this workflow does not prove that a commit was deployed.

    steps:
      - name: "⏳ Allow deployment propagation"
        run: sleep 90

      - name: "🚀 Smoke test — critical pages"
        run: |
          echo "🚀 SENTINEL APEX Smoke Test — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          BASE="https://blog.cyberdudebivash.in"
          FAILED=0

          check_url() {
            local url="$1"
            local label="$2"
            local min_size="${3:-1000}"

            HTTP_STATUS=$(curl -s -o /tmp/page_response -w "%{http_code}" \
              "$url" --max-time 15 -L \
              -H "User-Agent: SENTINEL-APEX-SmokeTest/1.0")

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ FAIL [$label] HTTP ${HTTP_STATUS} — $url"
              echo "::error title=Smoke Test Failed::$label returned HTTP ${HTTP_STATUS}. URL: $url"
              FAILED=$((FAILED+1))
              return
            fi

            BODY_SIZE=$(wc -c < /tmp/page_response)
            if [ "$BODY_SIZE" -lt "$min_size" ]; then
              echo "❌ FAIL [$label] Response too small (${BODY_SIZE} bytes < ${min_size}) — $url"
              echo "::error title=Smoke Test Failed::$label returned only ${BODY_SIZE} bytes — possible empty page"
              FAILED=$((FAILED+1))
              return
            fi

            echo "✅ OK  [$label] HTTP 200, ${BODY_SIZE} bytes"
          }

          # Critical pages
          check_url "$BASE/" "Homepage" 50000
          check_url "$BASE/intelligence.html" "Intel Hub" 20000
          check_url "$BASE/pricing.html" "Pricing" 10000
          check_url "$BASE/products.html" "Products" 10000
          check_url "$BASE/enterprise.html" "Enterprise" 10000
          check_url "$BASE/contact.html" "Contact/Sales" 10000
          check_url "$BASE/archive.html" "Archive" 20000
          check_url "$BASE/live-intel.json" "Live Intel API" 50000
          check_url "$BASE/rss.xml" "RSS Feed" 5000
          check_url "$BASE/sitemap.xml" "Sitemap" 1000

          echo ""
          echo "══════════════════════════════════"
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ SMOKE TEST FAILED — $FAILED page(s) unhealthy"
            echo "::error title=Production Smoke Test Failed::${FAILED} critical page(s) are not responding correctly. Check Cloudflare Worker deployment identity and logs."
            exit 1
          else
            echo "✅ ALL PAGES HEALTHY — Production smoke test passed"
          fi
          echo "══════════════════════════════════"

      - name: "🔍 Content integrity check"
        if: success()
        run: |
          echo "🔍 Checking live-intel.json content integrity..."

          curl -s "https://blog.cyberdudebivash.in/live-intel.json" | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const items = d.items || [];
            console.log('Items in feed  :', items.length);
            console.log('Critical items :', (d.stats||{}).critical || 0);
            console.log('Last updated   :', d.metadata?.generated || 'unknown');

            if (items.length < 10) {
              console.error('::error title=Feed Content Error::live-intel.json has only', items.length, 'items');
              process.exit(1);
            }

            // SOC Pro must never advertise the old $49/₹4,099 price (fixed
            // 2026-07-17 — see docs/PRICING.md). This is a hard failure, not
            // a warning: a stale price here is a customer-trust incident,
            // not a content-quality nit.
            const json = JSON.stringify(d);
            if (json.includes('\$49/mo') || json.includes('\$49/month')) {
              console.error('::error title=Pricing Regression::live-intel.json contains the old \$49/mo SOC Pro price — canonical price is \$18/mo (api/_lib/payment-utils.js).');
              process.exit(1);
            }

            console.log('✅ Content integrity OK');
          "

      # P0: HTTP 200 only proves the edge answers, not that its immutable
      # Cloudflare Workers ASSETS bundle matches the latest source feed.
      # Compare both canonical public domains with the checked-in source.
      # This probe is read-only: no Wrangler, cron, publishing or mutation.
      - name: "📥 Read-only snapshot source checkout"
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: "⚙️ Node.js 22 for deterministic public feed certification"
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: "🛡️ P0: Verify SOC and legacy edge feed freshness + source parity"
        run: |
          node --test tests-js/soc-public-feed-parity.test.js
          node scripts/certify-soc-public-feed-parity.cjs

      # P0: Homepage feed and S2N API can drift independently. On every
      # customer smoke check, diagnose BOTH fixed public S2N API hosts, even
      # when the preceding root-feed gate fails. No worker mutation; this
      # is source-ledger parity, not the exact-byte postdeploy certification.
      - name: "🛡️ P0: Verify SOC and blog public S2N API freshness and report IDs"
        if: ${{ !cancelled() }}
        run: |
          node scripts/certify-soc-s2n-api-release.cjs --monitor-public

      # P0 commerce cannot be hidden by an unrelated CTI freshness failure.
      # This is a read-only, bounded GET-only contract/CTA monitor. Passing it
      # does NOT prove a paid transaction or production managed-SOC readiness.
      - name: "💳 P0: Current paid checkout integrity — independent of CTI freshness"
        if: ${{ !cancelled() }}
        run: |
          node --test tests-js/soc-public-commerce.test.js
          node scripts/check-soc-public-commerce.cjs
