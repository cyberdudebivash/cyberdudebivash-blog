name: "🔒 SENTINEL APEX — Security Audit & Dependency Check"

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'api/**'
      - 'workers/**'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'vercel.json'
      - '.vercelignore'
      - 'vercel-ignore-build.sh'
      - 'automation/**'
      - 'lib/**'
      - 'scripts/**'
      - 'Sentinel-APEX/**'
      - 'fetch-live-intel.js'
      - 'generate-rss.js'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'api/**'
      - 'workers/**'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'vercel.json'
      - '.vercelignore'
      - 'vercel-ignore-build.sh'
      - 'automation/**'
      - 'lib/**'
      - 'scripts/**'
      - 'Sentinel-APEX/**'
      - 'fetch-live-intel.js'
      - 'generate-rss.js'
      - '.github/workflows/**'
  schedule:
    - cron: '39 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: "npm audit + Security Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: "🔒 npm audit — production critical vulnerabilities"
        run: |
          if [ ! -f "package.json" ]; then
            echo "No package.json found — dependency audit not applicable"
            exit 0
          fi
          npm ci --ignore-scripts --no-fund --legacy-peer-deps
          npm audit --omit=dev --audit-level=critical

      - name: "🔍 Production Secret Exposure Gate"
        shell: bash
        run: |
          set -euo pipefail
          # Synthetic credential-shaped fixtures are intentionally allowed only
          # inside test trees. Production/runtime/workflow/source surfaces remain
          # fail-closed. This prevents the exact false positive found on PR #178
          # without teaching the gate to ignore any real production credential.
          PATTERNS=(
            'sk_live_[A-Za-z0-9]+'
            'AKIA[A-Z0-9]{16}'
            'ghp_[A-Za-z0-9]{36}'
            'github_pat_[A-Za-z0-9_]+'
            'xox[baprs]-[A-Za-z0-9-]+'
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            while IFS= read -r match; do
              [ -z "$match" ] && continue
              echo "::error title=Potential Secret Exposure::Tracked production content matched a credential/private-key signature."
              echo "$match" | sed -E 's/([A-Za-z0-9_\/-]{6})[A-Za-z0-9_\/-]+/\1[REDACTED]/g'
              FOUND=1
            done < <(
              git grep -nE "$pattern" -- \
                ':!*.md' \
                ':!docs/**' \
                ':!.env.example' \
                ':!tests/**' \
                ':!tests-js/**' \
                ':!automation/tests/**' \
                ':!**/*.test.js' \
                ':!**/*.test.ts' \
                ':!**/*.spec.js' \
                ':!**/*.spec.ts' \
                2>/dev/null || true
            )
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Production secret exposure gate FAILED"
            exit 1
          fi
          echo "No credential/private-key signatures detected in tracked production content"

      - name: "Cloudflare runtime and security headers"
        run: |
          node scripts/check-cloudflare-runtime.js
          node --test workers/lib/security-headers.test.js scripts/check-cloudflare-runtime.test.js

      - name: "📋 Audit Summary"
        if: always()
        run: |
          echo "SENTINEL APEX security audit completed"
          echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Trigger: ${{ github.event_name }}"

