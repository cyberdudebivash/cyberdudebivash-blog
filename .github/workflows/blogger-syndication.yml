name: "⚡ CYBERDUDEBIVASH® — Blogger Syndication Engine"

on:
  # P0-SEARCH-RECOVERY-2026-09-22:
  # Keep public Blogger publication intentionally sparse while CTI Search
  # Console incident #219 is under recovery. Internal ingestion/APIs continue
  # independently. Eight public publication opportunities/day are sufficient
  # for freshness without a high-volume page-generation footprint.
  # Production code changes still get one immediate canary via path-filtered push.
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "automation/**"
      - ".github/workflows/blogger-syndication.yml"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate without publishing)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_posts:
        description: "Max posts per run (search-recovery production burst: 2)"
        required: false
        default: "2"

# P0-BLOGGER-FRESHNESS-2026-09-07:
# The Blogger publisher previously shared `main-content-writers` with the
# high-frequency Sentinel APEX, AI-security, RSS, CVE and intelligence-hub
# generators. GitHub Actions concurrency permits only one running and one
# pending run per concurrency group, so unrelated content-generation jobs could
# displace/serialize the 15-minute Blogger publication clock even though Blogger
# writes only its publication ledger/quota state/run report and rebases before
# pushing. Isolate the remote-publishing lane while still serializing Blogger
# against itself. The existing pull --rebase + bounded push retry below remains
# the cross-writer Git race safeguard.
concurrency:
  group: blogger-syndication-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  syndicate:
    name: "📡 Syndicate Premium Reports to Blogger"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🐍 Set Up Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "🟩 Set Up Node.js 24 for optional Puter bridge"
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: "🧩 Prepare Optional Puter User-Pays Runtime"
        env:
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          PUTER_AUTOMATION_ENABLED: ${{ vars.PUTER_AUTOMATION_ENABLED }}
        run: |
          node --check automation/puter_runtime/bridge.mjs
          if [ "${PUTER_AUTOMATION_ENABLED,,}" = "true" ] && [ -n "$PUTER_AUTH_TOKEN" ]; then
            echo "Puter automation explicitly enabled; installing pinned SDK runtime"
            npm install \
              --prefix automation/puter_runtime \
              --package-lock=false \
              --ignore-scripts \
              --no-audit \
              --no-fund
          else
            echo "Puter automation disabled or token absent; no Puter SDK install performed"
          fi

      - name: "✅ Validate Premium Publication Modules"
        run: |
          python -c "
          from automation.config import Config
          from automation.content_discovery import ContentDiscoveryEngine
          from automation.authority_transformer import AuthorityTransformer
          from automation.blogger_publisher import BloggerPublisher
          from automation.premium_factory_throughput import install_factory_throughput_overrides
          from automation.premium_evidence_compiler import install_premium_evidence_compiler_overrides
          from automation.provider_quota_ledger import install_provider_quota_ledger
          from automation.premium_publication import PremiumAuthorityTransformer, VerifiedBloggerPublisher, assess_enterprise_report, assess_live_artifact
          from automation.premium_zero_cost_mesh_v16 import install_zero_cost_mesh_v16
          from automation.premium_puter_user_pays_v17 import install_puter_user_pays_v17
          from automation.cti_publication_recovery_v19_2 import install_cti_publication_recovery_v19_2
          from automation.premium_main import main as premium_main
          from automation.seo_optimizer import SEOOptimizer
          from automation.social_amplifier import SocialAmplifier
          from automation.rss_aggregator import GlobalRSSAggregator
          from automation.threat_feeds import CISAAdvisoriesSource, RansomwareIntelSource, DataBreachIntelSource, ThreatActorIntelSource
          print('Premium publication + Global CTI Stage-2 + zero-cost v16 + guarded Puter v17 + publication recovery v19.2 modules imported successfully')
          "

      - name: "🧪 Run Unit & Integration Tests"
        run: |
          python -m pytest tests/ automation/tests/ \
            --tb=short \
            --timeout=30 \
            -q
        continue-on-error: false

      - name: "🔧 Configure Git"
        run: |
          git config user.name "CYBERDUDEBIVASH"
          git config user.email "bivash@cyberdudebivash.com"

      - name: "⚡ Run Premium Syndication Pipeline"
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ALIENVAULT_OTX_KEY: ${{ secrets.ALIENVAULT_OTX_KEY }}
          GOOGLE_SEARCH_CONSOLE_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          NEWSLETTER_SIGNUP_URL: ${{ secrets.NEWSLETTER_SIGNUP_URL }}

          # P0-ZERO-COST-MESH-V16: only zero-cost provider credentials are
          # injected into the production content job. DeepSeek/Anthropic secrets
          # may remain stored in GitHub for future commercial use but are not
          # exposed to this workflow while the platform is pre-revenue.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALLOW_PAID_LLM: "false"
          GEMINI_PUBLIC_DATA_ONLY: "true"
          NVIDIA_NIM_PUBLIC_DATA_ONLY: "true"

          # P0-PUTER-USER-PAYS-V17: backend Puter usage is *not* considered part
          # of the zero-cost provider pool because this token's account is the
          # metered user. It is opt-in, public-CTI-only, allowance-guarded, and
          # capped. Missing variables preserve fail-closed defaults in code.
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          PUTER_AUTOMATION_ENABLED: ${{ vars.PUTER_AUTOMATION_ENABLED }}
          PUTER_PUBLIC_DATA_ONLY: "true"
          PUTER_MODEL: ${{ vars.PUTER_MODEL }}
          PUTER_MAX_CALLS_PER_RUN: ${{ vars.PUTER_MAX_CALLS_PER_RUN }}
          PUTER_MIN_REMAINING_MICROCENTS: ${{ vars.PUTER_MIN_REMAINING_MICROCENTS }}

          MAX_POSTS_PER_RUN: ${{ github.event.inputs.max_posts || '2' }}
          CDB_FACTORY_RETRY_QUEUE_LIMIT: "500"
          CDB_FACTORY_RETRY_ATTEMPTS: "5"
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Running in DRY RUN mode — no posts will be published"
          fi

          set +e
          python -m automation.premium_main \
            $DRY_RUN_FLAG \
            --max-posts ${{ github.event.inputs.max_posts || '2' }} \
            2>&1 | tee logs/pipeline-output.txt
          PIPELINE_EXIT=${PIPESTATUS[0]}

          RUN_STATUS=$(python -c "
          import json, glob
          try:
              latest = sorted(glob.glob('logs/run-*.json'))[-1]
              with open(latest) as f:
                  print(json.load(f).get('run_status', 'UNKNOWN'))
          except Exception:
              print('UNKNOWN')
          " 2>/dev/null || echo "UNKNOWN")
          echo "Pipeline run_status: ${RUN_STATUS}"

          if [ "$PIPELINE_EXIT" -ne 0 ]; then
            echo "::error::Premium syndication pipeline exited with code ${PIPELINE_EXIT} (run_status=${RUN_STATUS})."
          elif [ "$RUN_STATUS" = "DEGRADED" ]; then
            echo "::warning::Premium syndication completed DEGRADED — reports below the premium public quality floor, evidence integrity gate, Blogger artifact verification, or provider availability requirements were held/requeued rather than published thin or corrupted."
          fi
          exit $PIPELINE_EXIT

      - name: "💾 Commit Publication State"
        if: always()
        run: |
          git add data/published_posts.json || true
          # Durable provider/model cooldown metadata contains no credentials,
          # prompts or response bodies and must survive the next scheduled run.
          if [ -f data/provider_quota_state.json ]; then
            git add data/provider_quota_state.json
          fi
          git add logs/*.json || true

          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi

          PUBLISHED=$(python -c "
          import json
          try:
            with open('data/published_posts.json') as f:
              d = json.load(f)
            print(d.get('total_published', 0))
          except:
            print(0)
          ")

          git commit -m "syndication: premium-published [${PUBLISHED} total posts] — $(date -u '+%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} --quiet 2>/dev/null || true
            if git push origin ${{ github.ref_name }}; then
              echo "Push succeeded on attempt ${attempt}"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Push failed, retrying in $((attempt * 3))s..."
              sleep $((attempt * 3))s
            else
              echo "Push failed after 3 attempts — state will sync next run"
              exit 0
            fi
          done

      - name: "📊 Pipeline Summary"
        if: always()
        run: |
          echo "=== CYBERDUDEBIVASH® Premium Blogger Syndication Summary ==="
          echo "Run timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          LATEST_REPORT=$(ls -t logs/run-*.json 2>/dev/null | head -1)
          if [ -n "$LATEST_REPORT" ]; then
            echo "Run report: $LATEST_REPORT"
            python -c "
          import json
          try:
            with open('$LATEST_REPORT') as f:
              r = json.load(f)
            print(f'Run status: {r.get(\"run_status\", \"UNKNOWN\")}')
            print(f'Discovered: {r.get(\"discovered\", 0)}')
            print(f'Published:  {r.get(\"published\", 0)}')
            print(f'Failed:     {r.get(\"failed\", 0)}')
            print(f'Integrity blocked: {r.get(\"integrity_blocked\", 0)}')
            print(f'Provider capacity deferred: {r.get(\"provider_capacity_deferred\", False)}')
            print(f'Fetch-back discrepancies: {r.get(\"fetch_back_discrepancies\", 0)}')
            print(f'Dry run:    {r.get(\"dry_run\", False)}')
            factory = r.get('factory_throughput') or {}
            if factory:
              print(f'Factory UTC today: {factory.get(\"published_today_utc\", 0)} / floor {factory.get(\"daily_floor\", 150)} / goal {factory.get(\"daily_goal\", 200)}')
              print(f'Factory theoretical write capacity/day: {factory.get(\"theoretical_daily_write_capacity\", 0)}')
            stage2 = r.get('premium_yield_stage2') or {}
            if stage2:
              print(f'Stage-2 premium yield: {stage2.get(\"premium_yield_pct\", 0)}%')
              print(f'Generation modes: {stage2.get(\"generation_mode_counts\", {})}')
              print(f'Gate failures: {stage2.get(\"gate_failure_counts\", {})}')
              print(f'Provider quota: {stage2.get(\"provider_quota\", {})}')
            recovery = r.get('cti_publication_recovery_v19_2') or {}
            if recovery:
              print(f'Publication recovery v19.2: scrubbed={recovery.get(\"dossiers_scrubbed\", 0)} bindings={recovery.get(\"certification_bindings_added\", 0)}')
            puter = r.get('puter_user_pays_v17') or {}
            if puter:
              print(f'Puter v17: enabled={puter.get(\"operator_opt_in_enabled\", False)} calls={puter.get(\"actual_calls\", 0)} successes={puter.get(\"successes\", 0)}')
            if r.get('provider_capacity'):
              print(f'Provider capacity deferral evidence: {r.get(\"provider_capacity\")}')
            if r.get('errors'):
              print(f'Errors: {r[\"errors\"]}')
          except Exception as e:
            print(f'Could not parse report: {e}')
            "
          else
            echo "No run report found"
          fi

          TOTAL=$(python -c "
          import json
          try:
            with open('data/published_posts.json') as f:
              d = json.load(f)
            print(d.get('total_published', 0))
          except:
            print(0)
          " 2>/dev/null || echo "0")
          echo "Total syndicated posts (all time): ${TOTAL}"
          echo "Public CTI recovery target: floor 6, goal 12, hard ceiling 16 Blogger pages/day"
          echo "Public CTI: https://cti.cyberdudebivash.in"
          echo "Source: https://blog.cyberdudebivash.in"

      - name: "🚨 Flag Pipeline Failure"
        if: failure()
        run: |
          echo "::error::CYBERDUDEBIVASH® Premium Blogger Syndication Pipeline FAILED"
          echo "::error::Check logs above for diagnosis"
          echo "::error::Contact: bivash@cyberdudebivash.com"
