name: "🚀 SENTINEL APEX — Cloudflare Production Deploy"

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'intel/**'
      - 'malware/**'
      - 'ai-security/**'
      - 'breaking/**'
      - 'leads.html'
      - 'api.html'
      - 'api-dashboard.html'
      - 'dossier.html'
      - 'hunts.html'
      - 'products.html'
      - 'pricing.html'
      - 'customer-assurance.html'
      - 'service-status.html'
      - 'enterprise-onboarding.html'
      - 'cti-delivery-acceptance.html'
      - 'soc-cti-console.css'
      - 'soc-triage-workspace.js'
      - 'soc-taxonomy-pivots.js'
      - 'soc-hybrid-workspace.js'
      - 'soc-evidence-drawer.js'
      - 'auto-intel-engine.js'
      - 'monetization.js'
      - 'conversion-engine.js'
      - 'revenue-cta-block.js'
      - 'ai-monetization-engine.js'
      - 'api/v1/intel.js'
      - 'api/v1/customer/assurance.js'
      - 'api/intel/**'
      - 'workers/**'
      - 'scripts/build-cloudflare-assets.js'
      - 'scripts/build-cloudflare-assets.test.js'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-production-deploy.yml'
      - '.github/workflows/production-drift-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: "Build, deploy and certify blog.cyberdudebivash.in"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: "Checkout exact commit"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: "Install locked dependencies"
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: "Cloudflare runtime gate"
        run: |
          npm run check:cloudflare
          node --test scripts/build-cloudflare-assets.test.js workers/lib/route-table.test.js workers/lib/router.test.js

      - name: "Commercial dashboard integrity gate"
        run: python3 tests/test_commercial_intel_surfaces.py

      - name: "Build allowlisted production assets"
        run: |
          npm run build:cloudflare
          test -s dist-public/intel/index.html
          test -s dist-public/malware/index.html
          test -s dist-public/ai-security/index.html
          test -s dist-public/breaking/index.html
          test -s dist-public/leads.html
          test -s dist-public/customer-assurance.html
          test -s dist-public/service-status.html
          test -s dist-public/enterprise-onboarding.html
          test -s dist-public/cti-delivery-acceptance.html
          test -s dist-public/api/intel/customer-assurance.json
          test -s dist-public/api/intel/service-assurance.json
          test -s dist-public/api/intel/cti-delivery-acceptance.json
          test -s dist-public/soc-cti-console.css
          test -s dist-public/soc-triage-workspace.js
          test -s dist-public/soc-taxonomy-pivots.js
          test -s dist-public/soc-hybrid-workspace.js
          test -s dist-public/soc-evidence-drawer.js

      - name: "Wrangler configuration dry-run"
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run

      - name: "Require deployment credentials"
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: "Retire Vercel DNS and deploy Cloudflare Custom Domain atomically"
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          zone_name="cyberdudebivash.in"
          hostname="blog.cyberdudebivash.in"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          zone_json="$(curl -fsS "${auth[@]}" "$api/zones?name=$zone_name&status=active")"
          test "$(jq -r '.success' <<<"$zone_json")" = "true" || { echo "::error::Cloudflare zone lookup failed"; exit 1; }
          zone_id="$(jq -r 'if (.result|length)==1 then .result[0].id else empty end' <<<"$zone_json")"
          test -n "$zone_id" || { echo "::error::Expected exactly one active Cloudflare zone for $zone_name"; exit 1; }

          dns_json="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$hostname&per_page=100")"
          test "$(jq -r '.success' <<<"$dns_json")" = "true" || { echo "::error::Cloudflare DNS lookup failed"; exit 1; }

          legacy_count="$(jq '[.result[] | select(.type=="CNAME" and ((.content|ascii_downcase)|contains("vercel")))] | length' <<<"$dns_json")"
          unrelated_cname_count="$(jq '[.result[] | select(.type=="CNAME" and (((.content|ascii_downcase)|contains("vercel"))|not))] | length' <<<"$dns_json")"

          if [ "$unrelated_cname_count" -gt 0 ]; then
            echo "::error::Refusing migration: $hostname has a non-Vercel CNAME that requires operator review."
            exit 1
          fi
          if [ "$legacy_count" -gt 1 ]; then
            echo "::error::Refusing migration: multiple legacy Vercel CNAME records found for $hostname."
            exit 1
          fi

          rollback_needed=0
          legacy_record=""
          if [ "$legacy_count" -eq 1 ]; then
            legacy_record="$(jq -c '.result[] | select(.type=="CNAME" and ((.content|ascii_downcase)|contains("vercel"))) | {id,type,name,content,ttl,proxied}' <<<"$dns_json")"
            legacy_id="$(jq -r '.id' <<<"$legacy_record")"
            legacy_target="$(jq -r '.content' <<<"$legacy_record")"
            echo "Retiring legacy Vercel DNS target for $hostname: $legacy_target"
            delete_json="$(curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$legacy_id")"
            test "$(jq -r '.success' <<<"$delete_json")" = "true" || { echo "::error::Failed to delete legacy Vercel CNAME"; exit 1; }
            rollback_needed=1
          else
            echo "No legacy Vercel CNAME exists; continuing idempotently."
          fi

          rollback() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$rollback_needed" -eq 1 ] && [ -n "$legacy_record" ]; then
              echo "::warning::Custom Domain deployment failed; restoring the previous DNS record to avoid an outage."
              restore_payload="$(jq -c '{type,name,content,ttl,proxied}' <<<"$legacy_record")"
              curl -fsS -X POST "${auth[@]}" --data "$restore_payload" "$api/zones/$zone_id/dns_records" >/dev/null || true
            fi
            exit "$status"
          }
          trap rollback EXIT

          npx wrangler deploy --config wrangler.jsonc
          rollback_needed=0
          trap - EXIT

      - name: "Verify Vercel DNS retirement"
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          zone_json="$(curl -fsS "${auth[@]}" "$api/zones?name=cyberdudebivash.in&status=active")"
          zone_id="$(jq -r 'if (.result|length)==1 then .result[0].id else empty end' <<<"$zone_json")"
          test -n "$zone_id"
          dns_json="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=blog.cyberdudebivash.in&per_page=100")"
          vercel_refs="$(jq '[.result[] | select((.content // "" | ascii_downcase) | contains("vercel"))] | length' <<<"$dns_json")"
          test "$vercel_refs" -eq 0 || { echo "::error::Legacy Vercel DNS target is still present"; exit 1; }
          echo "Vercel DNS retirement verified."

      - name: "Certify live Hybrid SOC + CTI production surfaces"
        shell: bash
        run: |
          set -euo pipefail
          base="https://blog.cyberdudebivash.in"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          verify_page() {
            local route="$1"
            local file="$2"
            local url="$base$route?release_sha=$GITHUB_SHA"
            local code=""
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -L --max-time 25 -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ] && grep -Fq 'HYBRID SOC + CTI' "$file"; then
                break
              fi
              echo "Waiting for Cloudflare propagation: $route attempt $attempt status=$code"
              sleep 10
            done
            test "$code" = "200" || { echo "::error::$route returned HTTP $code"; exit 1; }
            grep -Fq 'HYBRID SOC + CTI' "$file" || { echo "::error::$route is still serving the legacy dashboard"; exit 1; }
            grep -Fq 'Operational Intelligence Queue' "$file" || { echo "::error::$route missing PRO workspace"; exit 1; }
            grep -Fq 'SOC 2-aligned evidence; no certification claim' "$file" || { echo "::error::$route missing assurance disclosure"; exit 1; }
          }

          verify_page "/intel/" "$tmp/intel.html"
          verify_page "/malware/" "$tmp/malware.html"
          verify_page "/ai-security/" "$tmp/ai-security.html"

          ! grep -Fiq 'updated every 10 minutes from global threat feeds' "$tmp/intel.html"
          ! grep -Fiq '48h pre-disclosure CVE reports' "$tmp/intel.html"
          ! grep -Fiq '67+ victims this month' "$tmp/malware.html"
          ! grep -Fiq '73% of enterprise AI deployments vulnerable' "$tmp/ai-security.html"

          for asset in soc-cti-console.css soc-triage-workspace.js soc-taxonomy-pivots.js soc-hybrid-workspace.js soc-evidence-drawer.js; do
            code="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "$base/$asset?release_sha=$GITHUB_SHA")"
            test "$code" = "200" || { echo "::error::$asset returned HTTP $code"; exit 1; }
          done

          echo "PRODUCTION_DEPLOYMENT_VERIFIED_SHA=$GITHUB_SHA"
          echo "Hybrid SOC + CTI PRO console is live on all three customer surfaces."

      - name: "Certify SOC 2 + CTI homepage command center"
        shell: bash
        run: |
          set -euo pipefail
          base="https://blog.cyberdudebivash.in"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_page() {
            local route="$1"
            local file="$2"
            local code=""
            local ready=0
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -L --max-time 25 -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}' "$base$route?release_sha=$GITHUB_SHA" || true)"
              if [ "$code" = "200" ] \
                && grep -Fq 'Live CTI operational metrics' "$file" \
                && grep -Fq 'id="soc2-kev-count"' "$file" \
                && grep -Fq 'id="soc2-pipeline-age"' "$file"; then
                ready=1
                break
              fi
              echo "Waiting for homepage release propagation: $route attempt $attempt status=$code"
              sleep 10
            done
            test "$code" = "200" || { echo "::error::$route returned HTTP $code"; exit 1; }
            test "$ready" -eq 1 || { echo "::error::$route never exposed the current SOC 2 + CTI release markers"; exit 1; }
          }

          fetch_page "/" "$tmp/home.html"
          grep -Fq 'Hybrid SOC + CTI · Customer Control Plane' "$tmp/home.html" || { echo "::error::Homepage SOC + CTI command center missing"; exit 1; }
          grep -Fq 'Operational trust before analyst action.' "$tmp/home.html" || { echo "::error::Homepage operational hierarchy missing"; exit 1; }
          grep -Fq 'ALIGNED · NOT CERTIFIED' "$tmp/home.html" || { echo "::error::Homepage SOC 2 truth boundary missing"; exit 1; }
          grep -Fq 'SOURCE-BOUND' "$tmp/home.html" || { echo "::error::Homepage intelligence integrity state missing"; exit 1; }
          grep -Fq 'Synthetic Telemetry' "$tmp/home.html" || { echo "::error::Homepage synthetic telemetry disclosure missing"; exit 1; }
          grep -Fq 'Live CTI operational metrics' "$tmp/home.html" || { echo "::error::Homepage live CTI metrics missing"; exit 1; }
          grep -Fq 'Production Control Evidence' "$tmp/home.html" || { echo "::error::Homepage production control evidence missing"; exit 1; }
          grep -Fq 'id="soc2-kev-count"' "$tmp/home.html" || { echo "::error::Homepage CISA KEV runtime metric missing"; exit 1; }
          grep -Fq 'id="soc2-pipeline-age"' "$tmp/home.html" || { echo "::error::Homepage runtime-derived freshness missing"; exit 1; }
          grep -Fq 'Exact Git SHA → Cloudflare deployment' "$tmp/home.html" || { echo "::error::Homepage deployment integrity evidence missing"; exit 1; }
          grep -Fq '/customer-assurance.html' "$tmp/home.html" || { echo "::error::Homepage assurance navigation missing"; exit 1; }
          grep -Fq 'Evidence-Bound Analyst Queues' "$tmp/home.html" || { echo "::error::Evidence-bound analyst queues missing"; exit 1; }
          grep -Fq 'No synthetic victim counters' "$tmp/home.html" || { echo "::error::Homepage synthetic victim-counter policy missing"; exit 1; }
          ! grep -Fq 'Most Exploited CVEs This Week' "$tmp/home.html" || { echo "::error::Static exploited-this-week panel remains"; exit 1; }
          ! grep -Fq '67 Victims' "$tmp/home.html" || { echo "::error::Static victim-count assertion remains"; exit 1; }
          ! grep -Fq '$4.2B Demanded' "$tmp/home.html" || { echo "::error::Unsupported ransomware commercial metric remains"; exit 1; }
          ! grep -Fq '3B Users at Risk' "$tmp/home.html" || { echo "::error::Static exposure-count assertion remains"; exit 1; }
          ! grep -Fq 'Qilin/LockBit 4.0 Active — 67 Victims April' "$tmp/home.html" || { echo "::error::Stale hardcoded incident assertion remains on homepage"; exit 1; }
          ! grep -Fq 'Nation-State APT Tracking in Real Time' "$tmp/home.html" || { echo "::error::Unsupported real-time APT claim remains"; exit 1; }

          echo "SOC 2 + CTI homepage command center certified on $GITHUB_SHA"

      - name: "Certify SOC 2 + CTI customer assurance"
        shell: bash
        run: |
          set -euo pipefail
          base="https://blog.cyberdudebivash.in"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_page() {
            local route="$1"
            local file="$2"
            local code=""
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -L --max-time 25 -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}' "$base$route?release_sha=$GITHUB_SHA" || true)"
              if [ "$code" = "200" ]; then
                break
              fi
              echo "Waiting for assurance propagation: $route attempt $attempt status=$code"
              sleep 10
            done
            test "$code" = "200" || { echo "::error::$route returned HTTP $code"; exit 1; }
          }

          fetch_page "/customer-assurance.html" "$tmp/assurance.html"
          grep -Fq 'SOC 2-aligned operational evidence; not SOC 2 certified.' "$tmp/assurance.html" || { echo "::error::SOC 2 truth boundary missing"; exit 1; }
          grep -Fq 'CTI integrity controls' "$tmp/assurance.html" || { echo "::error::CTI integrity controls missing"; exit 1; }
          grep -Fq '/security-disclosure.html' "$tmp/assurance.html" || { echo "::error::Security disclosure path missing"; exit 1; }
          grep -Fq '/.well-known/security.txt' "$tmp/assurance.html" || { echo "::error::security.txt path missing"; exit 1; }
          grep -Fq '/privacy.html' "$tmp/assurance.html" || { echo "::error::Privacy boundary missing"; exit 1; }
          grep -Fq '/terms.html' "$tmp/assurance.html" || { echo "::error::Terms boundary missing"; exit 1; }
          ! grep -Fiq 'SOC 2 Type II certified' "$tmp/assurance.html" || { echo "::error::Unsupported SOC 2 certification claim detected"; exit 1; }

          fetch_page "/api/intel/customer-assurance.json" "$tmp/assurance.json"
          jq -e '.soc2_certified == false' "$tmp/assurance.json" >/dev/null || { echo "::error::Machine-readable SOC 2 status is not fail-closed"; exit 1; }
          jq -e '.soc2_attestation_published == false' "$tmp/assurance.json" >/dev/null || { echo "::error::Machine-readable attestation status is not fail-closed"; exit 1; }
          jq -e '.cti_controls.source_bound_evidence == true and .cti_controls.runtime_derived_freshness == true and .cti_controls.synthetic_customer_activity_metrics == false' "$tmp/assurance.json" >/dev/null || { echo "::error::CTI assurance controls are incomplete"; exit 1; }

          fetch_page "/enterprise.html" "$tmp/enterprise.html"
          grep -Fq '/customer-assurance.html' "$tmp/enterprise.html" || { echo "::error::Enterprise assurance path missing"; exit 1; }

          fetch_page "/intelligence.html" "$tmp/intelligence.html"
          grep -Fq '/customer-assurance.html' "$tmp/intelligence.html" || { echo "::error::CTI assurance path missing"; exit 1; }

          fetch_page "/service-status.html" "$tmp/service-status.html"
          grep -Fq 'Availability without invented percentages.' "$tmp/service-status.html" || { echo "::error::Service assurance truth model missing"; exit 1; }
          grep -Fq 'Marketing copy is not an SLA.' "$tmp/service-status.html" || { echo "::error::Service SLA truth boundary missing"; exit 1; }
          grep -Fq 'security@cyberdudebivash.in' "$tmp/service-status.html" || { echo "::error::Security escalation contact missing"; exit 1; }
          grep -Fq 'contact@cyberdudebivash.in' "$tmp/service-status.html" || { echo "::error::Customer incident contact missing"; exit 1; }

          fetch_page "/enterprise-onboarding.html" "$tmp/onboarding.html"
          grep -Fq 'From security review to accepted CTI delivery.' "$tmp/onboarding.html" || { echo "::error::Enterprise onboarding workflow missing"; exit 1; }
          grep -Fq 'GET /api/v1/customer/assurance' "$tmp/onboarding.html" || { echo "::error::Authenticated assurance export is absent from onboarding"; exit 1; }

          fetch_page "/cti-delivery-acceptance.html" "$tmp/acceptance.html"
          grep -Fq 'Acceptance is evidence, not assumption.' "$tmp/acceptance.html" || { echo "::error::CTI acceptance gate missing"; exit 1; }
          grep -Fq 'No silent acceptance.' "$tmp/acceptance.html" || { echo "::error::Acceptance truth boundary missing"; exit 1; }

          fetch_page "/api/intel/service-assurance.json" "$tmp/service-assurance.json"
          jq -e '.historical_uptime_percentage == null and .historical_uptime_claimed == false and .contractual_sla.status == "CUSTOMER_SPECIFIC_IF_EXECUTED"' "$tmp/service-assurance.json" >/dev/null || { echo "::error::Service assurance machine contract is unsafe"; exit 1; }

          fetch_page "/api/intel/cti-delivery-acceptance.json" "$tmp/acceptance.json"
          jq -e '.automatic_acceptance == false and (.criteria | length) == 10' "$tmp/acceptance.json" >/dev/null || { echo "::error::CTI delivery acceptance machine contract is incomplete"; exit 1; }

          code="$(curl -sS -L --max-time 20 -o "$tmp/auth-assurance.json" -w '%{http_code}' "$base/api/v1/customer/assurance?release_sha=$GITHUB_SHA")"
          test "$code" = "401" || { echo "::error::Authenticated customer assurance route must exist and fail closed with HTTP 401 without a key; got $code"; exit 1; }

          fetch_page "/api-dashboard.html" "$tmp/api-dashboard-assurance.html"
          grep -Fq 'Download Assurance JSON' "$tmp/api-dashboard-assurance.html" || { echo "::error::Customer dashboard assurance export control missing"; exit 1; }
          grep -Fq '/api/v1/customer/assurance?download=1' "$tmp/api-dashboard-assurance.html" || { echo "::error::Customer dashboard assurance export endpoint missing"; exit 1; }

          ! grep -Fiq '99.9% SLA UPTIME' "$tmp/enterprise.html" || { echo "::error::Unsupported enterprise uptime SLA remains"; exit 1; }
          ! grep -Fiq 'Sub-100ms latency' "$tmp/enterprise.html" || { echo "::error::Unsupported enterprise latency claim remains"; exit 1; }
          ! grep -Fiq 'Low FP guarantee' "$tmp/enterprise.html" || { echo "::error::Unsupported detection guarantee remains"; exit 1; }
          ! grep -Fiq 'before public disclosure' "$tmp/enterprise.html" || { echo "::error::Unsupported pre-disclosure claim remains"; exit 1; }

          echo "CTI customer assurance certified on $GITHUB_SHA"

      - name: "Certify revenue-critical customer journeys"
        shell: bash
        run: |
          set -euo pipefail
          base="https://blog.cyberdudebivash.in"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_page() {
            local route="$1"
            local file="$2"
            local code
            code="$(curl -sS -L --max-time 25 -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}' "$base$route?release_sha=$GITHUB_SHA")"
            test "$code" = "200" || { echo "::error::$route returned HTTP $code"; exit 1; }
          }

          fetch_page "/breaking/" "$tmp/breaking.html"
          grep -Fq 'Breaking Cyber Incidents' "$tmp/breaking.html" || { echo "::error::Breaking queue is not live"; exit 1; }

          fetch_page "/leads.html" "$tmp/leads.html"
          grep -Fq 'Get Free Intelligence Sample' "$tmp/leads.html" || { echo "::error::Lead funnel is missing"; exit 1; }
          grep -Fq "/api/v1/newsletter" "$tmp/leads.html" || { echo "::error::Lead capture endpoint is not wired"; exit 1; }
          grep -Fq 'SA-2026-0001' "$tmp/leads.html" || { echo "::error::Sample intelligence package is missing"; exit 1; }

          fetch_page "/api-dashboard.html" "$tmp/api-dashboard.html"
          grep -Fq 'your key is issued immediately on this page' "$tmp/api-dashboard.html" || { echo "::error::API onboarding disclosure is missing"; exit 1; }
          grep -Fq 'href="/terms.html"' "$tmp/api-dashboard.html" || { echo "::error::Terms link is not canonical"; exit 1; }
          grep -Fq 'Authentication required: enter your API key' "$tmp/api-dashboard.html" || { echo "::error::Authenticated-tab guidance is missing"; exit 1; }

          fetch_page "/products.html" "$tmp/products.html"
          grep -Fq 'Unverified standalone bundles have been withdrawn from direct sale' "$tmp/products.html" || { echo "::error::Unverified catalog items are still exposed for direct sale"; exit 1; }
          grep -Fq '/intelligence-store.html' "$tmp/products.html" || { echo "::error::Certified intelligence purchase path is missing"; exit 1; }

          code="$(curl -sS -L --max-time 20 -o "$tmp/engine.js" -w '%{http_code}' "$base/auto-intel-engine.js?release_sha=$GITHUB_SHA")"
          test "$code" = "200"
          grep -Fq 'function contextualUrl(base, item, intent)' "$tmp/engine.js" || { echo "::error::Commercial CTA context preservation is missing"; exit 1; }
          grep -Fq "u.searchParams.set('entity_id'" "$tmp/engine.js" || { echo "::error::Selected intelligence context is not preserved"; exit 1; }

          ! grep -Fiq 'Start 7-Day Free Trial' "$tmp/api-dashboard.html"
          ! grep -Fiq 'before public disclosure' "$tmp/leads.html"

          echo "Revenue-critical customer journeys certified on $GITHUB_SHA"
