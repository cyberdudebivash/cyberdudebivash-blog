name: "🚀 SENTINEL APEX — Cloudflare Production Deploy"

on:
  push:
    branches: [main]
    paths:
      - 'intel/**'
      - 'malware/**'
      - 'ai-security/**'
      - 'breaking/**'
      - 'leads.html'
      - 'api.html'
      - 'api-dashboard.html'
      - 'dossier.html'
      - 'hunts.html'
      - 'products.html'
      - 'pricing.html'
      - 'soc-cti-console.css'
      - 'soc-triage-workspace.js'
      - 'soc-taxonomy-pivots.js'
      - 'soc-hybrid-workspace.js'
      - 'soc-evidence-drawer.js'
      - 'auto-intel-engine.js'
      - 'monetization.js'
      - 'api/v1/intel.js'
      - 'api/intel/**'
      - 'workers/**'
      - 'scripts/build-cloudflare-assets.js'
      - 'scripts/build-cloudflare-assets.test.js'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: "Build, deploy and certify blog.cyberdudebivash.in"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: "Checkout exact commit"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: "Install locked dependencies"
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: "Cloudflare runtime gate"
        run: |
          npm run check:cloudflare
          node --test scripts/build-cloudflare-assets.test.js workers/lib/route-table.test.js workers/lib/router.test.js

      - name: "Commercial dashboard integrity gate"
        run: python3 tests/test_commercial_intel_surfaces.py

      - name: "Build allowlisted production assets"
        run: |
          npm run build:cloudflare
          test -s dist-public/intel/index.html
          test -s dist-public/malware/index.html
          test -s dist-public/ai-security/index.html
          test -s dist-public/breaking/index.html
          test -s dist-public/leads.html
          test -s dist-public/soc-cti-console.css
          test -s dist-public/soc-triage-workspace.js
          test -s dist-public/soc-taxonomy-pivots.js
          test -s dist-public/soc-hybrid-workspace.js
          test -s dist-public/soc-evidence-drawer.js

      - name: "Wrangler configuration dry-run"
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run

      - name: "Require deployment credentials"
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: "Retire Vercel DNS and deploy Cloudflare Custom Domain atomically"
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          zone_name="cyberdudebivash.in"
          hostname="blog.cyberdudebivash.in"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          zone_json="$(curl -fsS "${auth[@]}" "$api/zones?name=$zone_name&status=active")"
          test "$(jq -r '.success' <<<"$zone_json")" = "true" || { echo "::error::Cloudflare zone lookup failed"; exit 1; }
          zone_id="$(jq -r 'if (.result|length)==1 then .result[0].id else empty end' <<<"$zone_json")"
          test -n "$zone_id" || { echo "::error::Expected exactly one active Cloudflare zone for $zone_name"; exit 1; }

          dns_json="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$hostname&per_page=100")"
          test "$(jq -r '.success' <<<"$dns_json")" = "true" || { echo "::error::Cloudflare DNS lookup failed"; exit 1; }

          legacy_count="$(jq '[.result[] | select(.type=="CNAME" and ((.content|ascii_downcase)|contains("vercel")))] | length' <<<"$dns_json")"
          unrelated_cname_count="$(jq '[.result[] | select(.type=="CNAME" and (((.content|ascii_downcase)|contains("vercel"))|not))] | length' <<<"$dns_json")"

          if [ "$unrelated_cname_count" -gt 0 ]; then
            echo "::error::Refusing migration: $hostname has a non-Vercel CNAME that requires operator review."
            exit 1
          fi
          if [ "$legacy_count" -gt 1 ]; then
            echo "::error::Refusing migration: multiple legacy Vercel CNAME records found for $hostname."
            exit 1
          fi

          rollback_needed=0
          legacy_record=""
          if [ "$legacy_count" -eq 1 ]; then
            legacy_record="$(jq -c '.result[] | select(.type=="CNAME" and ((.content|ascii_downcase)|contains("vercel"))) | {id,type,name,content,ttl,proxied}' <<<"$dns_json")"
            legacy_id="$(jq -r '.id' <<<"$legacy_record")"
            legacy_target="$(jq -r '.content' <<<"$legacy_record")"
            echo "Retiring legacy Vercel DNS target for $hostname: $legacy_target"
            delete_json="$(curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$legacy_id")"
            test "$(jq -r '.success' <<<"$delete_json")" = "true" || { echo "::error::Failed to delete legacy Vercel CNAME"; exit 1; }
            rollback_needed=1
          else
            echo "No legacy Vercel CNAME exists; continuing idempotently."
          fi

          rollback() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$rollback_needed" -eq 1 ] && [ -n "$legacy_record" ]; then
              echo "::warning::Custom Domain deployment failed; restoring the previous DNS record to avoid an outage."
              restore_payload="$(jq -c '{type,name,content,ttl,proxied}' <<<"$legacy_record")"
              curl -fsS -X POST "${auth[@]}" --data "$restore_payload" "$api/zones/$zone_id/dns_records" >/dev/null || true
            fi
            exit "$status"
          }
          trap rollback EXIT

          npx wrangler deploy --config wrangler.jsonc
          rollback_needed=0
          trap - EXIT

      - name: "Verify Vercel DNS retirement"
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          zone_json="$(curl -fsS "${auth[@]}" "$api/zones?name=cyberdudebivash.in&status=active")"
          zone_id="$(jq -r 'if (.result|length)==1 then .result[0].id else empty end' <<<"$zone_json")"
          test -n "$zone_id"
          dns_json="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=blog.cyberdudebivash.in&per_page=100")"
          vercel_refs="$(jq '[.result[] | select((.content // "" | ascii_downcase) | contains("vercel"))] | length' <<<"$dns_json")"
          test "$vercel_refs" -eq 0 || { echo "::error::Legacy Vercel DNS target is still present"; exit 1; }
          echo "Vercel DNS retirement verified."

      - name: "Certify live Hybrid SOC + CTI production surfaces"
        shell: bash
        run: |
          set -euo pipefail
          base="https://blog.cyberdudebivash.in"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          verify_page() {
            local route="$1"
            local file="$2"
            local url="$base$route?release_sha=$GITHUB_SHA"
            local code=""
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -L --max-time 25 -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ] && grep -Fq 'HYBRID SOC + CTI' "$file"; then
                break
              fi
              echo "Waiting for Cloudflare propagation: $route attempt $attempt status=$code"
              sleep 10
            done
            test "$code" = "200" || { echo "::error::$route returned HTTP $code"; exit 1; }
            grep -Fq 'HYBRID SOC + CTI' "$file" || { echo "::error::$route is still serving the legacy dashboard"; exit 1; }
            grep -Fq 'Operational Intelligence Queue' "$file" || { echo "::error::$route missing PRO workspace"; exit 1; }
            grep -Fq 'SOC 2-aligned evidence; no certification claim' "$file" || { echo "::error::$route missing assurance disclosure"; exit 1; }
          }

          verify_page "/intel/" "$tmp/intel.html"
          verify_page "/malware/" "$tmp/malware.html"
          verify_page "/ai-security/" "$tmp/ai-security.html"

          ! grep -Fiq 'updated every 10 minutes from global threat feeds' "$tmp/intel.html"
          ! grep -Fiq '48h pre-disclosure CVE reports' "$tmp/intel.html"
          ! grep -Fiq '67+ victims this month' "$tmp/malware.html"
          ! grep -Fiq '73% of enterprise AI deployments vulnerable' "$tmp/ai-security.html"

          for asset in soc-cti-console.css soc-triage-workspace.js soc-taxonomy-pivots.js soc-hybrid-workspace.js soc-evidence-drawer.js; do
            code="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "$base/$asset?release_sha=$GITHUB_SHA")"
            test "$code" = "200" || { echo "::error::$asset returned HTTP $code"; exit 1; }
          done

          echo "PRODUCTION_DEPLOYMENT_VERIFIED_SHA=$GITHUB_SHA"
          echo "Hybrid SOC + CTI PRO console is live on all three customer surfaces."
