name: "📨 SENTINEL APEX — Watchlist Alert Delivery"

# Autonomous Alert Orchestration, GitHub-Actions-to-D1 bridge. Runs
# evaluate-watchlist-changes.js then deliver-watchlist-notifications.js on
# a schedule. freshness-check.yml and sentinel-apex.yml already run
# natively on a 30-minute `schedule:` cadence without issue in this exact
# repo; api/cron/dispatch-intel.js's own comment documents that GitHub's
# native scheduler is UNRELIABLE below roughly 30 minutes ("observed:
# 5-30 minute schedules firing every ~4h in practice") -- so 30 minutes
# here is the fastest cadence this repo's own evidence supports trusting,
# not an arbitrary choice. This defines the real internal delivery SLO: a
# dispatch attempt within ~30 minutes of a change becoming eligible, never
# claimed as real-time.
#
# Runtime policy (Cloudflare-Only Alert Runtime tranche): this workflow is
# a BRIDGE, not the sole production scheduler going forward -- Cloudflare
# Workers is now the operator-authorized production alert-delivery
# runtime (workers/entry.js's `scheduled` export, wrangler.jsonc's
# triggers.crons), kept in step with this workflow by both paths reading/
# writing the SAME D1 database (see notification-store.js). This workflow
# stays ACTIVE, not retired, until live Cloudflare Cron execution is
# actually proven from an environment with real Cloudflare credentials --
# see docs/audits/SENTINEL-APEX-CLOUDFLARE-RUNTIME-DEPENDENCY-INVENTORY.md
# §4 for why retiring it any earlier would leave a real gap ("do not
# leave a period with zero scheduler"). This IS the hard acceptance
# criterion this tranche was built to satisfy: production alert execution
# continues via this path if Cloudflare Cron is unavailable or not yet
# deployed, and continues via Cloudflare Cron if this workflow (or GitHub
# Actions generally) is unavailable, because neither path is the only
# writer of delivery state.
#
# Scope note: this workflow schedules BOTH change evaluation and alert
# delivery, not delivery alone. Scheduling delivery without evaluation
# would leave the customer-facing "you get alerted automatically when a
# tracked CVE's KEV status flips" promise still false end-to-end (nothing
# would create new events to deliver) -- the two scripts already share an
# identical CLI-wrapper shape, so covering both here is one extra `run`
# line, not a parallel mechanism. Watchlists/change-detection moved from
# Redis to Cloudflare D1 as of the Cloudflare-Only Runtime Completion v2
# tranche (see watchlist-store.js's own header) -- the EVALUATE step now
# needs D1 too, not just Redis (see the secrets note below for exactly
# why each step needs each store).
#
# Concurrency (not correctness): cancel-in-progress:false makes an
# overlapping invocation WAIT rather than run in parallel, which reduces
# how often the application-level safety net below is even exercised.
# It is not a substitute for that safety net -- GitHub Actions can still
# retry a job, a run can still overlap a manual workflow_dispatch or a
# Cloudflare Cron invocation, and a runner can still die mid-job. The
# actual at-least-once-safe guarantee is
# api/_lib/notification-store.js's atomic D1 claim-with-lease (see
# notification-dispatch.js's processDueDeliveries() doc) -- true
# regardless of what triggers it, how many times, or which runtime it
# executes on.
#
# Required GitHub Actions repository secrets (both steps now need BOTH
# stores, since the Cloudflare-Only Runtime Completion v2 tranche moved
# watchlists/change-detection onto D1 alongside the already-D1-backed
# alert-delivery control plane -- a real change from this workflow's
# prior shape, where only the deliver step needed D1):
#   - UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN -- gates BOTH
#     steps' customer-identity lookups (notification-dispatch.js's
#     getOwnerAccountEmail(), reached during the EVALUATE step's own
#     fan-out via dispatchNewEvent(), and again from the DELIVER step) --
#     auth/billing remain Redis-backed, LEGACY subsystems this tranche
#     does not touch; see the Cloudflare Runtime Inventory V2 doc.
#   - CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_D1_DATABASE_ID /
#     CLOUDFLARE_API_TOKEN -- gates BOTH steps' own D1-backed state
#     (watchlists/snapshots/events for evaluate; delivery jobs/log for
#     deliver) via api/_lib/d1.js's REST API transport (this script runs
#     under plain Node, never inside a Worker, so it always uses the REST
#     path, never the native env.DB binding). As of this workflow's
#     update it is UNVERIFIED/likely NOT YET configured as GitHub Actions
#     repository secrets (this sandbox has no authenticated Cloudflare
#     account access to provision a real D1 database or mint an API
#     token in the first place -- `wrangler whoami` -> not authenticated,
#     confirmed before this change). If unset, BOTH steps now skip with a
#     visible warning rather than failing confusingly on every scheduled
#     run -- there is no longer a "D1-independent" evaluate path once
#     watchlists/change-detection depend on D1 too.
# RESEND_API_KEY is passed through if configured but not required --
# deliver-watchlist-notifications.js already handles its absence
# gracefully (email deliveries fail soft as EMAIL_NOT_CONFIGURED and
# retry/dead-letter like any other failure; webhook delivery is
# unaffected), so no separate preflight gate is needed for it.
#
# --limit=50 on the deliver step (found via a local scale measurement,
# not guessed): processDueDeliveries() runs sequentially, and each
# webhook attempt can take up to WEBHOOK_TIMEOUT_MS=8s before giving up.
# notification-store.js's own getDuePendingDeliveries() already hard-caps
# a single call to 500 records regardless of the limit requested -- but
# 500 sequential worst-case timeouts is 500*8s=~67 minutes, far past this
# job's timeout-minutes. 50 keeps the worst case at ~7 minutes, leaving
# headroom for the evaluate step and checkout/setup within the 15-minute
# budget below.

on:
  schedule:
    - cron: '27,57 * * * *'
  workflow_dispatch:

concurrency:
  group: alert-delivery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert-delivery:
    name: "Evaluate watchlist changes and deliver due alerts"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "🟢 Set up Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: "🔍 Check required secrets are configured"
        id: preflight
        env:
          HAS_REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL != '' }}
          HAS_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_CF_DB: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID != '' }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_REDIS_URL" = "true" ] && [ "$HAS_REDIS_TOKEN" = "true" ]; then
            echo "redis_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "redis_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Watchlist change evaluation AND alert delivery both skipped — UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN are not configured as GitHub Actions repository secrets. Same values already used in the Cloudflare Worker environment (a different secret store) need to be added here too before this workflow can run."
          fi
          if [ "$HAS_CF_ACCOUNT" = "true" ] && [ "$HAS_CF_DB" = "true" ] && [ "$HAS_CF_TOKEN" = "true" ]; then
            echo "d1_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "d1_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Watchlist change evaluation AND alert delivery both skipped — CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_D1_DATABASE_ID / CLOUDFLARE_API_TOKEN are not configured as GitHub Actions repository secrets yet. Both steps now depend on D1 (watchlists/change-detection as of the Cloudflare-Only Runtime Completion v2 tranche, delivery state since PR #138)."
          fi

      - name: "🔎 Evaluate watchlist changes"
        if: steps.preflight.outputs.redis_ready == 'true' && steps.preflight.outputs.d1_ready == 'true'
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/evaluate-watchlist-changes.js

      - name: "📨 Deliver due alerts"
        if: steps.preflight.outputs.redis_ready == 'true' && steps.preflight.outputs.d1_ready == 'true'
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/deliver-watchlist-notifications.js --limit=50

